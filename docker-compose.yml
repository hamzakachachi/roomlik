services:
  roomly:
    build:
      context: .
      dockerfile: Dockerfile
    image: roomly:latest
    container_name: roomly
    init: true
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_FILE: /app/data/rooms.json
      TOKEN_SECRET: "${TOKEN_SECRET:?Set TOKEN_SECRET in a .env file}"
    volumes:
      - roomly_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/rooms"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s

volumes:
  roomly_data:
    name: roomly_data
